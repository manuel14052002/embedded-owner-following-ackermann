segmentation:
  obstacle_confidence: 0.35
  obstacle_class_ids: []
  backend: ultralytics
  model_path: yolo11n-seg_480_fp16.engine   # a2r_speed
  confidence_threshold: 0.4
  nms_iou_threshold: 0.5
  image_size: 480   # a2r_speed
  half_precision: true
  max_detections: 20
  min_box_height: 48.0
  min_mask_fraction: 0.05
  person_class_id: 0
  remove_background: false
reid:
  backend: tensorrt
  model_path: models/osnet_x1_0.engine
  feature_dim: 512
  input_height: 256
  input_width: 128
  batch_size: 16
  half_precision: false
  l2_normalize: true
  torchreid_model_name: osnet_x1_0
calibration:
  num_samples: 240        # [A2R-LEARN] was 120
  calibration_fraction: 0.6666666666666666
  threshold_k: 2.5
  metric: gallery
  min_interval_s: 0.066
  duration_s: 121        # [A2R-LEARN] was 12
  require_single_person: true
  sigma_floor_relative: 0.05
  sigma_floor_absolute: 1.0e-06
  distance_bins_m:
  - 1.0
  - 2.0
  - 3.0
  - 4.5
  min_bins_covered: 2
  shuffle_seed: 0
identity:
  top_k: 3
  negative_margin: 0.03
  max_negatives: 300
  negative_max_iou: 0.05
  negative_confident_factor: 0.8
  online_update: true
  max_online: 400   # a2r_owner_memory: was 150
  online_interval_s: 1.0
  online_confident_factor: 0.7
  online_min_negative_margin: 0.1
  online_max_iou: 0.1
  online_duplicate_sim: 0.97
  online_from_tracking: true
  tracking_threshold_factor: 1.3
  continuity_iou: 0.4
  continuity_factor: 1.8   # a2r_idguard: was 2.5
ownership:
  enabled: true
  claim_hold_s: 1.5
  release_hold_s: 3.0
  raised_fraction: 0.25
  gesture_gap_s: 0.6
  max_candidates: 2
  hands_per_frame: 1
  calibration_s: 121.0   # [A2R-LEARN] was 12.0 (>= 2 min enrollment)
  claim_lost_s: 3.0
  owner_lost_release_s: 600.0   # v2.7: was 60 - keep the owner while the Pi searches
  release_cooldown_s: 3.0
  start_following: true
  follow_timeout_s: 5.0
  voice_arm_s: 30.0
  voice_claim_hold_s: 0.5
  hand_check_every: 1
  hand_async: true
localization:
  min_depth_m: 0.3
  max_depth_m: 8.0
  mask_erosion_px: 5
  pixel_stride: 2
  min_points: 50
  centroid: mean
  depth_inlier_band_m: 0.0
  expiration_time_s: 3.0
  mirror_x: false
  bbox_range_fallback: false
  assumed_person_height_m: 1.7
  confirm_frames: 1
  confirm_radius_m: 0.5
  gate_m: 1.5
  max_person_speed_mps: 1.5
  process_noise_accel: 3.0
  measurement_noise_m: 0.1
gestures:
  enabled: true
  backend: auto
  task_model_path: hand_landmarker.task
  classifier_path: models/gesture_svm.joblib
  consecutive_required: 5
  min_detection_confidence: 0.6
  min_tracking_confidence: 0.5
  only_target_person: true
  crop_padding: 0.15
  mirror_left_hands: true
  svm_c: 10.0
  svm_gamma: scale
  async_mode: true
  hand_process: true
navigation:
  owner_smooth_alpha: 1.0
  min_drive_speed: 0.168
  goal_turn_speed: 0.199
  goal_max_speed: 0.24
  goal_trim_ki: 0.4
  goal_k_ang: 1.0
  goal_pp_lookahead_m: 0.9
  max_velocity_mps: 0.09
  safety_factor: 1.4
  safety_radius_m: 0.5
  goal_update_distance_m: 0.2
  goal_update_period_s: 1.0
  goal_standoff_m: 0.0
  search_angular_speed: 0.5
  search_linear_speed: 0.05
  search_max_angle_rad: 3.1416
  search_move_s: 1.5
  search_pause_s: 0.5
  follow_distance_m: 1.2
  k_linear: 0.8
  k_angular: 2.0
  max_angular_rps: 0.8
  accel_mps2: 0.5
  decel_mps2: 1.0
  turn_slowdown: true
  cmd_timeout_s: 0.5
  min_steer_speed_mps: 0.09
  steer_from_measurement: true
  ackermann_wheelbase_m: 0.28
  ackermann_max_steer_deg: 30.0
  steering_law: pi_goal
  apf_enabled: true
  apf_influence_m: 1.2
  apf_k_rep: 0.6
  apf_owner_exclusion_m: 0.5
  apf_lookahead_m: 1.2
  hold_hysteresis_m: 0.3
  steer_smoothing: 0.3
  steer_rate_limit_dps: 90.0
  pid_kp: 1.0
  pid_ki: 0.3
  pid_kd: 0.0
  pid_i_limit_rad: 0.5
state_machine:
  initial_state: WAIT
  steady_requires_follow_gesture: false
  wait_from_any_state: true
device: auto
