[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "owner-tracker-followme"
version = "1.1.0"
description = "Identity-preserving owner tracker + FollowMe (arXiv:2311.12992) person following"
requires-python = ">=3.8"
dependencies = ["numpy>=1.24", "opencv-python>=4.8", "PyYAML>=6.0"]

[project.optional-dependencies]
followme = ["scikit-learn>=1.3", "joblib", "mediapipe>=0.10", "onnxruntime>=1.16", "matplotlib"]

[tool.setuptools]
packages = ["owner_tracking", "followme"]
